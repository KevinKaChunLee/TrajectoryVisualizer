name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  # Proves TrajViz works WITHOUT DECAF (standalone): core suite + the
  # attribution degradation/render/construction tests that need no corpus.
  # The DECAF integration tests skip here by design (no `awe` on the path).
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (standalone — DECAF absent)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  # Runs the DECAF failure-attribution integration tests against the vendored
  # fixture. TRAJVIZ_REQUIRE_ATTRIBUTION=1 makes a missing environment a hard
  # failure, so the suite can never be green merely by skipping them.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out DECAF (from the ARGUS monorepo)
        uses: actions/checkout@v4
        with:
          repository: rshu/ARGUS
          token: ${{ secrets.ARGUS_PAT }}   # PAT with read access to the private monorepo
          path: _argus
          sparse-checkout: DECAF
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (integration — DECAF present, no silent skips)
        env:
          PYTHONPATH: ${{ github.workspace }}
          AWE_DECAF_PATH: ${{ github.workspace }}/_argus/DECAF
          TRAJVIZ_REQUIRE_ATTRIBUTION: "1"
        run: python -m pytest -q
