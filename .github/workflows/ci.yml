name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Proves TrajViz works WITHOUT DECAF (standalone): core suite + the
  # attribution degradation/render/construction tests that need no corpus.
  # The DECAF integration tests skip here by design (no `awe` on the path).
  #
  # This is the ONLY workflow that runs on pull_request: the DECAF integration
  # needs a private-monorepo checkout, which must never coexist with
  # PR-controlled code (see integration.yml — trusted contexts only).
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Test (standalone — DECAF absent)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python -m pytest -q
