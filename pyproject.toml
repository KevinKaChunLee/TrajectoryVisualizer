[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajviz"
version = "1.0.0"
description = "Offline analytics & visualization for LLM agent trajectories (Claude Code, OpenCode, CodeArts, Codex CLI)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Rui Shu" }]
keywords = ["llm", "agent", "trajectory", "visualization", "analytics", "gradio", "plotly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "gradio>=6.14.0",
    "gradio_client>=2.5.0",
    "plotly>=5.0",
    "pygments>=2.0",
    "pandas>=2.0",
    "requests>=2.0",
]

[project.optional-dependencies]
# Test runner (used by tests/, previously undeclared). Run under Python >=3.11.
dev = [
    "pytest>=7.0",
]
# NOTE (Attribution tab): the DECAF failure-attribution integration imports the
# `awe` package from a DECAF checkout. DECAF is stdlib-only and not published to
# PyPI, so there is intentionally NO pip extra for it — install is: clone DECAF
# and set AWE_DECAF_PATH (default: a sibling ../DECAF checkout). See README
# "Failure attribution (DECAF)" and docs/decaf-integration-plan.md.

[project.scripts]
trajviz = "trajviz.insight.__main__:main"

[project.urls]
Homepage = "https://github.com/rshu/TrajectoryVisualizer"
Repository = "https://github.com/rshu/TrajectoryVisualizer"
Issues = "https://github.com/rshu/TrajectoryVisualizer/issues"

[tool.hatch.build.targets.wheel]
packages = ["trajviz"]
